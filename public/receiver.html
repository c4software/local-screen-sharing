<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client - Visualisation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 30px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            width: 40px;
            height: 40px;
            font-size: 20px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-icon {
            font-size: 24px;
        }

        .title h1 {
            color: #f1f5f9;
            font-size: 24px;
            font-weight: 600;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .status-badge.disconnected {
            background: rgba(107, 114, 128, 0.15);
            border-color: rgba(107, 114, 128, 0.3);
        }

        .status-badge.connecting {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-badge.disconnected .status-dot {
            background: #6b7280;
        }

        .status-badge.connecting .status-dot {
            background: #f59e0b;
        }

        .status-text {
            color: #10b981;
            font-size: 14px;
            font-weight: 500;
        }

        .status-badge.disconnected .status-text {
            color: #9ca3af;
        }

        .status-badge.connecting .status-text {
            color: #f59e0b;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Video Container */
        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #64748b;
            background: #0f172a;
        }

        .placeholder.hidden {
            display: none;
        }

        .placeholder-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .placeholder-text {
            font-size: 18px;
        }

        /* Video Controls Bar */
        .video-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-container:hover .video-controls {
            opacity: 1;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            font-size: 18px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(102, 126, 234, 0.8);
            transform: scale(1.1);
        }

        /* Connection Panel */
        .connection-panel {
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            margin-top: 20px;
        }

        .input-group {
            display: flex;
            gap: 15px;
        }

        input {
            flex: 1;
            padding: 16px 20px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            color: #f1f5f9;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-align: center;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
        }

        input::placeholder {
            color: #475569;
            text-transform: none;
            letter-spacing: normal;
            font-size: 16px;
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Fullscreen Mode */
        .video-wrapper:fullscreen {
            background: #000;
        }

        .video-wrapper:fullscreen video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-wrapper:fullscreen .placeholder {
            background: #000;
        }

        .video-wrapper:fullscreen .fullscreen-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-wrapper:fullscreen:hover .fullscreen-controls {
            opacity: 1;
        }

        .fullscreen-controls {
            display: none;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="window.location.href='/'">←</button>
            <div class="title">
                <span class="title-icon">📺</span>
                <h1>Client</h1>
            </div>
        </div>
        <div id="statusBadge" class="status-badge disconnected">
            <div class="status-dot"></div>
            <span id="statusText" class="status-text">Déconnecté</span>
        </div>
    </div>

    <div class="video-container">
        <div class="video-wrapper" id="videoWrapper">
            <video id="remoteVideo" autoplay playsinline></video>
            <div id="placeholder" class="placeholder">
                <div class="placeholder-icon">📺</div>
                <div class="placeholder-text">En attente de connexion...</div>
            </div>
            <div class="fullscreen-controls">
                <button class="control-btn" id="exitFullscreenBtn" title="Quitter plein écran">✕</button>
            </div>
        </div>
        <div class="video-controls">
            <button class="control-btn" id="fullscreenBtn" title="Plein écran">⛶</button>
        </div>
    </div>

    <div class="connection-panel">
        <div class="input-group">
            <input
                   type="text"
                   id="codeInput"
                   placeholder="Entrez le code de session (ex: A1B2)"
                   maxlength="4" />
            <button id="connectBtn" class="btn btn-primary">🔗 Connecter</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let pc = null;
        let socket = null;

        const remoteVideo = document.getElementById('remoteVideo');
        const placeholder = document.getElementById('placeholder');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const codeInput = document.getElementById('codeInput');
        const connectBtn = document.getElementById('connectBtn');
        const videoWrapper = document.getElementById('videoWrapper');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');

        function updateStatus(state, text) {
            statusBadge.className = `status-badge ${state}`;
            statusText.textContent = text;
        }

        async function connect() {
            const sessionCode = codeInput.value.trim().toUpperCase();
            if (sessionCode.length !== 4) {
                alert('Le code de session doit contenir 4 caractères');
                return;
            }

            try {
                updateStatus('connecting', 'Connexion...');

                socket = io();

                socket.on('connect', () => {
                    console.log('Connecté au serveur de signalisation');

                    pc = new RTCPeerConnection({
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' }
                        ]
                    });

                    pc.ontrack = (event) => {
                        console.log('Track reçu:', event.streams[0]);
                        remoteVideo.srcObject = event.streams[0];
                        placeholder.classList.add('hidden');
                        updateStatus('connected', 'Connecté');
                    };

                    pc.onicecandidate = (e) => {
                        if (e.candidate) {
                            socket.emit('send-ice-candidate', {
                                sessionCode,
                                candidate: e.candidate
                            });
                        }
                    };

                    pc.oniceconnectionstatechange = () => {
                        const state = pc.iceConnectionState;
                        if (state === 'connected' || state === 'completed') {
                            updateStatus('connected', 'Connecté (P2P)');
                        } else if (state === 'disconnected') {
                            updateStatus('disconnected', 'Déconnecté');
                        } else if (state === 'failed') {
                            updateStatus('disconnected', 'Échec');
                        }
                    };

                    pc.onconnectionstatechange = () => {
                        const state = pc.connectionState;
                        if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                            updateStatus('disconnected', 'Déconnecté');
                            placeholder.classList.remove('hidden');
                        }
                    };

                    socket.emit('join-session', { sessionCode });
                });

                socket.on('receive-offer', async ({ offer }) => {
                    await pc.setRemoteDescription(offer);
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('send-answer', { sessionCode, answer });
                });

                socket.on('receive-ice-candidate', async ({ candidate }) => {
                    try {
                        if (pc && candidate) {
                            await pc.addIceCandidate(candidate);
                        }
                    } catch (err) {
                        console.warn('Erreur ICE:', err);
                    }
                });

                socket.on('session-joined', () => {
                    updateStatus('connecting', 'En attente du flux...');
                });

                socket.on('sender-disconnected', () => {
                    updateStatus('disconnected', 'Serveur déconnecté');
                    placeholder.classList.remove('hidden');
                    cleanup();
                });

                socket.on('error', ({ message }) => {
                    alert('Erreur: ' + message);
                    updateStatus('disconnected', 'Erreur');
                });

            } catch (err) {
                console.error('Erreur:', err);
                updateStatus('disconnected', 'Erreur');
                alert('Erreur: ' + err.message);
            }
        }

        function cleanup() {
            if (pc) {
                pc.close();
                pc = null;
            }
            if (socket) {
                socket.disconnect();
                socket = null;
            }
        }

        // Event listeners
        connectBtn.addEventListener('click', connect);
        codeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') connect();
        });

        // Fullscreen - on met la vidéo en plein écran, pas le container
        function enterFullscreen() {
            if (videoWrapper.requestFullscreen) {
                videoWrapper.requestFullscreen();
            } else if (videoWrapper.webkitRequestFullscreen) {
                videoWrapper.webkitRequestFullscreen();
            } else if (videoWrapper.msRequestFullscreen) {
                videoWrapper.msRequestFullscreen();
            }
        }

        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        fullscreenBtn.addEventListener('click', enterFullscreen);
        exitFullscreenBtn.addEventListener('click', exitFullscreen);

        // Double-clic sur la vidéo pour fullscreen
        videoWrapper.addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                enterFullscreen();
            } else {
                exitFullscreen();
            }
        });

        // Raccourcis clavier
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                if (!document.fullscreenElement) {
                    enterFullscreen();
                }
            }
        });

        console.log('%c📺 CLIENT P2P', 'color: #667eea; font-size: 16px; font-weight: bold;');
        console.log('Raccourcis: F = Plein écran, Double-clic = Toggle plein écran');
    </script>
</body>

</html>
