<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client - Visualisation</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/receiver.js"></script>
</head>

<body x-data="receiver" x-cloak>
    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="window.location.href='/'">←</button>
            <div class="title">
                <span class="title-icon">📺</span>
                <h1>Client</h1>
            </div>
        </div>
        <div class="status-badge" :class="status">
            <div class="status-dot"></div>
            <span class="status-text" x-text="statusText">Déconnecté</span>
        </div>
    </div>

    <div class="video-container receiver-mode" x-show="isConnected" x-cloak>
        <div class="video-wrapper" x-ref="videoWrapper" @dblclick="toggleFullscreen">
            <video x-ref="remoteVideo" autoplay playsinline></video>
            <div class="fullscreen-controls">
                <button class="control-btn" @click="toggleFullscreen" title="Quitter plein écran">✕</button>
            </div>
        </div>
        <div class="video-controls">
            <button class="control-btn" @click="toggleFullscreen" title="Plein écran">⛶</button>
        </div>
    </div>

    <div class="connection-panel" x-show="!isConnected" x-cloak>
        <h2 class="connection-title">📺 Rejoindre une session</h2>
        <p class="connection-description">Entrez le code de session à 4 caractères fourni par le serveur</p>
        <div class="input-group">
            <input type="text" x-model="code" placeholder="Entrez le code de session (ex: A1B2)" maxlength="4" @keyup.enter="connect" />
            <button @click="connect" class="btn btn-primary">🔗 Connecter</button>
        </div>
    </div>
</body>

</html>
