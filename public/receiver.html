<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client - Visualisation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        .fullscreen-overlay {
            position: absolute;
            inset: auto 1rem 1rem auto;
            display: flex;
            gap: 0.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 150ms ease;
        }

        .video-wrapper:hover .fullscreen-overlay,
        .video-wrapper:focus-within .fullscreen-overlay,
        .video-wrapper:fullscreen .fullscreen-overlay,
        .video-wrapper:fullscreen:hover .fullscreen-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        @media (hover: none) {
            .fullscreen-overlay {
                opacity: 1;
                pointer-events: auto;
            }
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/receiver.js"></script>
</head>

<body x-data="receiver" x-cloak class="min-h-screen bg-slate-100 text-slate-900 dark:bg-gradient-to-br dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 dark:text-slate-100">
    <div class="max-w-4xl mx-auto p-6 md:p-8">
        <div class="flex items-center justify-end mb-6">
            <div class="flex items-center gap-2 rounded-full border px-4 py-2 text-sm"
                 :class="{
                    'bg-emerald-500/15 border-emerald-500/30 text-emerald-300': status === 'connected',
                    'bg-amber-500/15 border-amber-500/30 text-amber-300': status === 'connecting',
                    'bg-slate-500/15 border-slate-500/30 text-slate-300': status === 'disconnected'
                }">
                <div class="h-2 w-2 rounded-full"
                     :class="{
                        'bg-emerald-400 animate-pulse': status === 'connected',
                        'bg-amber-400 animate-pulse': status === 'connecting',
                        'bg-slate-400': status === 'disconnected'
                    }"></div>
                <span x-text="statusText">Déconnecté</span>
            </div>
        </div>

        <div class="rounded-2xl border border-slate-200 bg-white/90 shadow-2xl overflow-hidden group dark:border-white/10 dark:bg-slate-900/90" x-show="isConnected" x-cloak>
            <div class="relative bg-black flex items-center justify-center min-h-[320px] video-wrapper" x-ref="videoWrapper" @dblclick="toggleFullscreen">
                <video x-ref="remoteVideo" autoplay playsinline class="h-full w-full object-contain"></video>
                <div class="fullscreen-overlay">
                    <button class="rounded-lg bg-black/60 px-3 py-2 text-sm text-white shadow-lg backdrop-blur hover:bg-black/75 focus:outline-none focus:ring-2 focus:ring-indigo-400/70" @click="toggleFullscreen" title="Basculer plein écran">⛶</button>
                </div>
            </div>
        </div>

        <div class="rounded-2xl border border-slate-200 bg-white/90 p-8 text-center dark:border-white/10 dark:bg-slate-900/90" x-show="!isConnected" x-cloak>
            <h2 class="text-xl font-semibold mb-2">📺 Rejoindre une session</h2>
            <p class="text-sm text-slate-600 dark:text-slate-400 mb-6">Entrez le code de session à 4 caractères fourni par le serveur</p>
            <div class="flex flex-col gap-3 sm:flex-row">
                <input type="text" x-model="code" placeholder="Entrez le code de session (ex: A1B2)" maxlength="4" @keyup.enter="connect" @input="normalizeCode($event)" inputmode="text" autocapitalize="characters" autocomplete="one-time-code" pattern="[A-Za-z0-9]{4}" aria-label="Code de session à 4 caractères"
                       class="flex-1 rounded-lg border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500/40 dark:border-white/15 dark:bg-white/5 dark:text-slate-100" />
                <button @click="connect" :disabled="code.length !== 4" class="rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 px-5 py-3 text-sm font-semibold text-white shadow-lg transition hover:-translate-y-0.5 hover:shadow-indigo-500/30 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none">
                    🔗 Connecter
                </button>
            </div>
        </div>
    </div>
</body>

</html>
