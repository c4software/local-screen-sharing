<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client - Visualisation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        .fullscreen-overlay {
            position: absolute;
            inset: auto 1rem 1rem auto;
            display: flex;
            gap: 0.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 150ms ease;
        }

        .video-wrapper:hover .fullscreen-overlay,
        .video-wrapper:focus-within .fullscreen-overlay,
        .video-wrapper:fullscreen .fullscreen-overlay,
        .video-wrapper:fullscreen:hover .fullscreen-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        @media (hover: none) {
            .fullscreen-overlay {
                opacity: 1;
                pointer-events: auto;
            }
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/receiver.js"></script>
</head>

<body x-data="receiver" x-cloak class="min-h-screen bg-slate-50 text-slate-900 dark:bg-gradient-to-br dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 dark:text-slate-100">
    <div class="max-w-5xl mx-auto p-6 md:p-8">
        <!-- Notifications -->
        <div x-show="notification" x-transition class="fixed bottom-6 right-6 max-w-sm rounded-xl shadow-xl p-4 text-sm font-medium z-50"
             :class="{
                'bg-emerald-50 border border-emerald-300 text-emerald-900 dark:bg-emerald-900/20 dark:border-emerald-700 dark:text-emerald-300': notification?.type === 'success',
                'bg-blue-50 border border-blue-300 text-blue-900 dark:bg-blue-900/20 dark:border-blue-700 dark:text-blue-300': notification?.type === 'info',
                'bg-amber-50 border border-amber-300 text-amber-900 dark:bg-amber-900/20 dark:border-amber-700 dark:text-amber-300': notification?.type === 'warning',
                'bg-red-50 border border-red-300 text-red-900 dark:bg-red-900/20 dark:border-red-700 dark:text-red-300': notification?.type === 'error'
             }">
            <span x-text="notification?.message"></span>
        </div>
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <a href="/" class="text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100">←</a>
                <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Regarder un écran partagé</h1>
            </div>
            <div class="flex items-center gap-2 rounded-full border px-4 py-2 text-sm font-medium"
                 :class="{
                    'bg-emerald-50 border-emerald-300 text-emerald-700 dark:bg-emerald-900/20 dark:border-emerald-700 dark:text-emerald-300': status === 'connected',
                    'bg-amber-50 border-amber-300 text-amber-700 dark:bg-amber-900/20 dark:border-amber-700 dark:text-amber-300': status === 'connecting',
                    'bg-slate-100 border-slate-300 text-slate-600 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-400': status === 'disconnected'
                }">
                <div class="h-2 w-2 rounded-full"
                     :class="{
                        'bg-emerald-500 animate-pulse': status === 'connected',
                        'bg-amber-500 animate-pulse': status === 'connecting',
                        'bg-slate-400': status === 'disconnected'
                    }"></div>
                <span x-text="statusText">Déconnecté</span>
            </div>
        </div>

        <div class="rounded-2xl border border-slate-200 bg-white/95 shadow-lg overflow-hidden dark:border-white/10 dark:bg-slate-900/95" x-show="isConnected" x-cloak>
            <div class="relative bg-black flex items-center justify-center min-h-[480px] video-wrapper" x-ref="videoWrapper" @dblclick="toggleFullscreen" title="Double-cliquez pour agrandir ou appuyez sur F">
                <video x-ref="remoteVideo" autoplay playsinline class="h-full w-full object-contain"></video>
                <div class="fullscreen-overlay">
                    <button class="rounded-lg bg-black/70 px-4 py-2 text-sm text-white shadow-lg backdrop-blur hover:bg-black/85 focus:outline-none focus:ring-2 focus:ring-indigo-400/70 transition" @click="toggleFullscreen" title="Plein écran (F)">
                        ⛶
                    </button>
                </div>
            </div>
            <div class="border-t border-slate-200 dark:border-white/10 px-6 py-4 text-xs text-slate-600 dark:text-slate-400">
                Appuyez sur <kbd class="px-2 py-1 bg-slate-200 dark:bg-slate-800 rounded text-xs font-mono">F</kbd> ou double-cliquez pour passer en plein écran
            </div>
        </div>

        <div class="rounded-2xl border border-slate-200 bg-white/95 p-8 dark:border-white/10 dark:bg-slate-900/95" x-show="!isConnected" x-cloak>
            <div class="max-w-md mx-auto text-center">
                <h2 class="text-2xl font-bold mb-3 text-slate-900 dark:text-slate-100">Connexion à une session</h2>
                <p class="text-slate-600 dark:text-slate-400 mb-8">Entrez le code de session à 4 caractères partagé par la personne qui partage son écran</p>

                <div class="flex justify-center gap-3 mb-8" x-init="$nextTick(() => focusInput(0))">
                    <template x-for="index in 4" :key="index">
                        <input
                               :data-code-index="index - 1"
                               type="text"
                               inputmode="text"
                               maxlength="1"
                               autocomplete="one-time-code"
                               autocapitalize="characters"
                               pattern="[A-Za-z0-9]"
                               aria-label="Caractère du code"
                               class="h-16 w-16 rounded-xl border-2 border-slate-300 bg-white text-center text-3xl font-bold uppercase tracking-wider shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 dark:border-white/20 dark:bg-slate-800 dark:text-slate-100 transition"
                               :value="codeDigits[index - 1]"
                               @input="handleCodeInput(index - 1, $event)"
                               @keydown.backspace.prevent="handleBackspace(index - 1)"
                               @keyup.enter="connect"
                               @paste="handlePaste($event)" />
                    </template>
                </div>

                <button
                        @click="connect()"
                        :disabled="codeDigits.join('').length !== 4"
                        class="w-full rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-700 px-6 py-4 text-sm font-semibold text-white shadow-lg transition hover:-translate-y-0.5 hover:shadow-indigo-500/40 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none">
                    Connexion
                </button>
            </div>
        </div>
    </div>
</body>

</html>
