<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serveur - Partage d'écran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/sender.js"></script>
</head>

<body x-data="sender" x-cloak class="min-h-screen bg-slate-100 text-slate-900 dark:bg-gradient-to-br dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 dark:text-slate-100">
    <div class="max-w-4xl mx-auto p-6 md:p-8">
        <div class="flex items-center justify-end mb-6">
            <div class="flex items-center gap-2 rounded-full border px-4 py-2 text-sm"
                 :class="{
                    'bg-emerald-500/15 border-emerald-500/30 text-emerald-300': status === 'connected',
                    'bg-amber-500/15 border-amber-500/30 text-amber-300': status === 'warning' || status === 'connecting',
                    'bg-slate-500/15 border-slate-500/30 text-slate-300': status === 'inactive' || status === 'disconnected'
                }">
                <div class="h-2 w-2 rounded-full"
                     :class="{
                        'bg-emerald-400 animate-pulse': status === 'connected',
                        'bg-amber-400 animate-pulse': status === 'warning' || status === 'connecting',
                        'bg-slate-400': status === 'inactive' || status === 'disconnected'
                    }"></div>
                <span x-text="statusText">Inactif</span>
            </div>
        </div>

        <div class="grid gap-6 lg:grid-cols-2" x-show="isSupported" x-cloak>
            <div class="rounded-2xl border border-slate-200 bg-white/90 shadow-2xl overflow-hidden dark:border-white/10 dark:bg-slate-900/90">
                <div class="relative bg-black flex items-center justify-center h-64 lg:h-full" x-ref="videoWrapper">
                    <video x-ref="preview" autoplay muted playsinline class="h-full w-full object-contain"></video>
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 bg-slate-100/80 dark:text-slate-500 dark:bg-slate-950/80" :class="{ 'hidden': stream }">
                        <div class="text-5xl mb-3 opacity-60">🖥️</div>
                        <div class="text-sm">Cliquez sur "Partager" pour commencer</div>
                    </div>
                </div>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white/90 p-6 dark:border-white/10 dark:bg-slate-900/90">
                <div class="mb-6" x-show="isSessionActive" x-cloak>
                    <div class="text-xs uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-2 text-center">Code de session</div>
                    <div class="text-center text-3xl font-bold tracking-[0.5em] text-indigo-400 font-mono" x-text="sessionCode">----</div>
                </div>

                <div class="grid gap-4 md:grid-cols-2 mb-6">
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-medium text-slate-500 dark:text-slate-400">Images/sec (FPS)</label>
                        <select x-model="fps" @change="updateFps" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 dark:border-white/15 dark:bg-white/5 dark:text-slate-100">
                            <option value="60">60 FPS (Fluide)</option>
                            <option value="30">30 FPS (Standard)</option>
                            <option value="15">15 FPS (Économique)</option>
                            <option value="5">5 FPS (Diaporama)</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-medium text-slate-500 dark:text-slate-400">Qualité (Résolution)</label>
                        <select x-model="scale" @change="updateScale" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 dark:border-white/15 dark:bg-white/5 dark:text-slate-100">
                            <option value="1">100% (Original)</option>
                            <option value="1.33">75%</option>
                            <option value="2">50% (Recommandé)</option>
                            <option value="4">25% (Léger)</option>
                        </select>
                    </div>
                </div>

                <button x-show="!isSessionActive" @click="startSharing" class="w-full rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 px-5 py-4 text-sm font-semibold text-white shadow-lg transition hover:-translate-y-0.5 hover:shadow-indigo-500/30" x-cloak>
                    🖥️ Partager mon écran
                </button>

                <div x-show="isSessionActive" x-cloak class="grid gap-4 md:grid-cols-2">
                    <button @click="changeSource" class="rounded-xl border border-indigo-400/40 bg-indigo-500/10 px-5 py-4 text-sm font-semibold text-indigo-700 transition hover:bg-indigo-500/20 dark:text-indigo-200">
                        🔄 Changer la source
                    </button>
                    <button @click="stopSharing" class="rounded-xl border border-red-400/40 bg-red-500/10 px-5 py-4 text-sm font-semibold text-red-700 transition hover:bg-red-500/20 dark:text-red-200">
                        ⏹️ Arrêter
                    </button>
                </div>
            </div>
        </div>

        <div class="rounded-2xl border border-slate-200 bg-white/90 p-8 text-center text-red-600 dark:border-white/10 dark:bg-slate-900/90 dark:text-red-300" x-show="!isSupported" x-cloak>
            <h2 class="text-lg font-semibold mb-2">Partage d'écran non supporté</h2>
            <p class="text-sm text-red-500/80 dark:text-red-200/80">Votre navigateur ne supporte pas la fonctionnalité de partage d'écran.</p>
        </div>
    </div>
</body>

</html>
