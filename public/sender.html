<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serveur - Partage d'écran</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/sender.js"></script>
</head>

<body x-data="sender" x-cloak>
    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="window.location.href='/'">←</button>
            <div class="title">
                <span class="title-icon">📡</span>
                <h1>Serveur</h1>
            </div>
        </div>
        <div class="status-badge" :class="status">
            <div class="status-dot"></div>
            <span class="status-text" x-text="statusText">Inactif</span>
        </div>
    </div>

    <div class="main-content">

        <div class="sender-dashboard">
            <div class="video-container preview-mode">
                <div class="video-wrapper" x-ref="videoWrapper">
                    <video x-ref="preview" autoplay muted playsinline></video>
                    <div class="placeholder" :class="{ 'hidden': stream }">
                        <div class="placeholder-icon">🖥️</div>
                        <div class="placeholder-text">Cliquez sur "Partager" pour commencer</div>
                    </div>
                </div>
            </div>

            <div class="action-panel">
                <div class="session-info" x-show="isSessionActive" x-cloak>
                    <div class="session-label">Code de session</div>
                    <div class="session-code-mini" x-text="sessionCode">----</div>
                </div>

                <div class="settings-row">
                    <div class="setting-group">
                        <label class="setting-label">Images/sec (FPS)</label>
                        <select x-model="fps" @change="updateFps" class="setting-select">
                            <option value="60">60 FPS (Fluide)</option>
                            <option value="30">30 FPS (Standard)</option>
                            <option value="15">15 FPS (Économique)</option>
                            <option value="5">5 FPS (Diaporama)</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">Qualité (Résolution)</label>
                        <select x-model="scale" @change="updateScale" class="setting-select">
                            <option value="1">100% (Original)</option>
                            <option value="1.33">75%</option>
                            <option value="2">50% (Recommandé)</option>
                            <option value="4">25% (Léger)</option>
                        </select>
                    </div>
                </div>

                <button x-show="!isSessionActive" @click="startSharing" class="btn btn-primary" x-cloak>🖥️ Partager mon écran</button>

                <div x-show="isSessionActive" x-cloak>
                    <div class="button-group">
                        <button @click="changeSource" class="btn btn-secondary">🔄 Changer la source</button>
                        <button @click="stopSharing" class="btn btn-danger">⏹️ Arrêter</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
