<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC P2P - Partage d'écran</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="home">
    <div class="home-container">
        <div class="home-logo">🖥️</div>
        <h1>Partage d'écran P2P</h1>
        <p class="home-subtitle">Partagez votre écran en temps réel via une connexion peer-to-peer sécurisée</p>

        <div class="cards">
            <div class="card" onclick="window.location.href='/sender'">
                <div class="card-icon">📡</div>
                <div class="card-title">Serveur</div>
                <div class="card-desc">Partager mon écran avec d'autres</div>
            </div>

            <div class="card" onclick="window.location.href='/receiver'">
                <div class="card-icon">📺</div>
                <div class="card-title">Client</div>
                <div class="card-desc">Voir l'écran partagé d'un serveur</div>
            </div>
        </div>

        <div class="footer">
            WebRTC • Peer-to-peer • Chiffré de bout en bout
        </div>
    </div>
</body>

</html>
