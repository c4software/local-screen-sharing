<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC P2P - Partage d'écran</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900 dark:bg-gradient-to-br dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 dark:text-slate-100 flex items-center justify-center p-6">
    <div class="w-full max-w-4xl rounded-3xl border border-slate-200 bg-white/95 p-12 text-center shadow-2xl dark:border-white/10 dark:bg-slate-900/95">
        <h1 class="text-4xl font-bold mb-3 text-slate-900 dark:text-slate-50">Partage d'écran</h1>
        <p class="text-lg text-slate-600 dark:text-slate-300 mb-12 max-w-2xl mx-auto">Partagez votre écran en temps réel avec une connexion sécurisée et chiffrée. Aucune donnée n'est stockée sur nos serveurs.</p>

        <div class="grid gap-6 md:grid-cols-2">
            <button onclick="window.location.href='/sender'" class="group rounded-2xl border border-slate-200 bg-gradient-to-br from-slate-50 to-slate-100 p-10 transition hover:border-indigo-400/50 hover:shadow-xl dark:border-white/10 dark:from-slate-800 dark:to-slate-900 dark:hover:border-indigo-500/50">
                <div class="text-5xl mb-5 inline-block rounded-full bg-indigo-100 p-4 transition group-hover:scale-110 dark:bg-indigo-900/50">📤</div>
                <h2 class="text-2xl font-semibold text-slate-900 dark:text-slate-100 mb-3">Partager l'écran</h2>
                <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">Envoyez votre écran ou une application en temps réel aux participants</p>
            </button>

            <button onclick="window.location.href='/receiver'" class="group rounded-2xl border border-slate-200 bg-gradient-to-br from-slate-50 to-slate-100 p-10 transition hover:border-indigo-400/50 hover:shadow-xl dark:border-white/10 dark:from-slate-800 dark:to-slate-900 dark:hover:border-indigo-500/50">
                <div class="text-5xl mb-5 inline-block rounded-full bg-indigo-100 p-4 transition group-hover:scale-110 dark:bg-indigo-900/50">📥</div>
                <h2 class="text-2xl font-semibold text-slate-900 dark:text-slate-100 mb-3">Regarder</h2>
                <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">Recevez et visualisez l'écran partagé d'une autre personne</p>
            </button>
        </div>

        <div class="mt-10 text-xs text-slate-500 dark:text-slate-400 border-t border-slate-200 dark:border-white/10 pt-8">
            <p>Connexion peer-to-peer directe • Aucun intermédiaire • Chiffrement de bout en bout</p>
        </div>
    </div>
</body>

</html>
