<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC P2P - Partage d'écran</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 50px;
            font-size: 16px;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            border-radius: 16px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border-color: #667eea;
        }

        .card-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .card-title {
            color: #333;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-desc {
            color: #666;
            font-size: 14px;
        }

        .footer {
            color: #999;
            font-size: 13px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        @media (max-width: 600px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🖥️</div>
        <h1>Partage d'écran P2P</h1>
        <p class="subtitle">Partagez votre écran en temps réel via une connexion peer-to-peer sécurisée</p>

        <div class="cards">
            <div class="card" onclick="goToSender()">
                <div class="card-icon">📡</div>
                <div class="card-title">Serveur</div>
                <div class="card-desc">Partager mon écran avec d'autres</div>
            </div>

            <div class="card" onclick="goToReceiver()">
                <div class="card-icon">📺</div>
                <div class="card-title">Client</div>
                <div class="card-desc">Voir l'écran partagé d'un serveur</div>
            </div>
        </div>

        <div class="footer">
            WebRTC • Peer-to-peer • Chiffré de bout en bout
        </div>
    </div>

    <script>
        function goToSender() {
            window.location.href = '/sender';
        }

        function goToReceiver() {
            window.location.href = '/receiver';
        }
    </script>
</body>

</html>
